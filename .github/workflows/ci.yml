name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          check-latest: true

      - name: Install analysis tools
        run: |
          pip install --upgrade black isort ruff bandit vulture
          npm install --global pyright@latest

      - name: Format
        run: black -l 132 -t py311 .

      - name: Import-order check
        run: isort --check-only .

      - name: Lint
        run: ruff check --line-length 132 .

      - name: Bytecode compilation check
        run: python -m compileall -q engram scripts eval tests

      - name: Security scan
        run: bandit -q -ii -lll -r engram scripts eval

      - name: Dead-code scan
        run: vulture

      # pymgclient builds from source and needs OpenSSL headers and CMake.
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Check dependency compatibility
        run: pip check

      - name: Audit dependencies
        run: pip-audit --desc -r requirements.txt

      - name: Type check
        run: pyright

      - name: Fetch NLTK data
        run: python -m engram.nltk_data

      - name: Fetch spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Test
        run: pytest

      - name: Learning-loop eval
        run: python eval/run_learning_eval.py
