name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install analysis tools
        run: pip install --upgrade black isort ruff bandit vulture pytest

      - name: Format
        run: black -l 132 -t py311 .

      - name: Check formatter diff
        run: git diff --exit-code -- '*.py'

      - name: Import-order check
        run: isort --check-only .

      - name: Lint
        run: ruff check --line-length 132 .

      - name: Bytecode compilation check
        run: python -m compileall -q engram scripts eval tests

      - name: Security scan
        run: bandit -q -ii -lll -r engram scripts eval

      - name: Dead-code scan
        run: vulture

      - name: Type check
        run: npx --yes pyright@latest

      - name: First-party source-contract checks
        run: pytest -q tests/test_source_contracts.py
