name: Python Analysis and Tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install analysis tools
        run: pip install --upgrade isort ruff bandit vulture pytest

      - name: Import-order check
        run: isort --check-only .

      - name: Lint
        run: ruff check --line-length 132 .

      - name: Bytecode compilation check
        run: python -m compileall -q engram scripts tests

      - name: Security scan
        run: bandit -q -ii -lll -r engram scripts

      - name: Dead-code scan
        run: vulture

  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install application and test dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Check dependency compatibility
        run: pip check

      - name: Install Pyright
        run: npm install --global pyright

      - name: Type check
        run: pyright

      - name: Provision NLP resources
        run: |
          python -m engram.nltk_data
          python -m spacy download en_core_web_sm

      - name: Runtime tests
        run: pytest
