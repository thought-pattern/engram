name: Python Autoformatting

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
  push:
    branches: [main, develop]
    paths:
      - "**/*.py"
      - "pyproject.toml"

permissions:
  pull-requests: write
  contents: write

jobs:
  format-python:
    # GitHub does not grant a write token to fork or Dependabot pull requests.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install formatting tools
        run: pip install --upgrade black isort ruff

      - name: Configure Git
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git fetch -q
          git checkout "$BRANCH" --progress
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only

      - name: Run code formatters
        run: |
          isort .
          ruff check --fix --exit-zero --line-length 132 .
          black -l 132 -t py311 .

      - name: Check for changes
        id: git-check
        run: |
          git add -- '*.py'
          if git diff-index --quiet HEAD; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git commit -m "Apply Python autoformatting"
          git push
