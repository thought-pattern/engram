name: Static Analysis

on:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/static-analysis.yml"
  push:
    branches: [develop, main]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/static-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-security:
    name: Lint and Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install analysis tools
        run: python -m pip install --upgrade bandit isort ruff vulture

      - name: Import-order check
        run: isort --check-only .

      - name: Run Ruff
        run: ruff check .

      - name: Bytecode compilation check
        run: python -m compileall -q engram scripts tests

      - name: Security scan
        run: python -m bandit --configfile pyproject.toml -q -ii -lll -r engram scripts

      - name: Dead-code scan
        run: python -m vulture

  typecheck-and-tests:
    name: Pyright and Runtime Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies and package metadata
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Verify runtime and package dependency compatibility
        run: python -m pip check

      - name: Install type-checking and test dependencies
        run: python -m pip install psutil pyright "pytest>=9.1.1" "pytest-cov>=7.1.0"

      - name: Verify combined dependency compatibility
        run: python -m pip check

      - name: Run Pyright
        run: python -m pyright

      - name: Provision NLP resources
        run: |
          python -m engram.nltk_data
          python -m spacy download en_core_web_sm

      - name: Run tests
        run: python -m pytest
