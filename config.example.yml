# ENGRAM configuration template.
#
# Copy this file to config.yml and edit it:  cp config.example.yml config.yml
# config.yml is gitignored (local config); this template is tracked. Any setting
# you omit falls back to its built-in default (shown below).
#
# This file configures Engram when it runs on its own, with or without a graph
# database: the gRPC server (--config-path config.yml), the CLI (--config) and
# engram.config.load_config read it. A host that runs Engram as one of its parts,
# such as Tapestry, passes its complete configuration to
# engram.config.config_from_dict instead, and Engram does not read this file.

# --- Capacity ---
capacity: 10000 # Maximum DYNAMIC statements
max_sessions: 10000 # Maximum concurrent sessions
session_ttl_seconds: 86400 # Session time-to-live in seconds (24 hours)

# --- Scoring weights (keyword retrieval) ---
weight_base: 0.5
weight_recency: 0.3
weight_hit_rate: 0.2
recency_half_life_seconds: 604800 # Recency decay half-life (7 days)

# --- Sessions ---
session_overflow: lru # reject | expire_oldest | lru

# --- Input processing ---
expand_contractions: true
retrieval_rewrites_enabled: false # Retrieval-only Section 11 rules; does not execute AIML templates
learn_user_facts: true # Learn shared facts with per-user attribution
srai_depth_limit: 100

# --- Eviction ---

# --- Matching / NLP ---
use_stemming: true # Porter-stemmed fallback matching
use_lemmatization: true # WordNet-lemmatized fallback matching
use_synonyms: true # WordNet synonym expansion on keyword queries
max_synonyms_per_word: 3
use_spell_correction: true # Correct input typos toward the store vocabulary
use_spacy_facts: false # spaCy dependency-parse fact extraction (needs en_core_web_sm)
use_spacy_lemmatization: false # spaCy context-aware lemmas in the matcher
use_phrase_keywords: false # spaCy noun-chunk phrase keywords for retrieval

# --- Sparse retrieval (optional, local, rebuildable) ---
# Derived entirely from authoritative accepted-response artifacts. No index data
# is persisted. Response prose is excluded unless explicitly opted in.
sparse:
  enabled: false
  include_response_text: false
  max_query_terms: 64
  max_posting_visits: 100000
  max_prefix_expansions: 64

# --- Standalone semantic retrieval (optional, local, rebuildable) ---
# Provision the pinned artifact explicitly with
# `PYTHONPATH=. python3 scripts/provision_semantic_model.py`, then copy the emitted manifest
# values below. Runtime startup never downloads model files. Canonical requests
# and aliases are embedded; accepted-response prose is never embedded.
semantic:
  enabled: false
  model_path: ""
  model_id: sentence-transformers/all-MiniLM-L6-v2
  model_revision: ""
  license_id: apache-2.0
  artifact_sha256: ""
  dimension: 384
  backend: native # native | onnx | quantized; only provisioned/installed backends become ready
  batch_size: 32
  max_input_bytes: 16384
  max_records: 100000
  max_scan_records: 100000
  min_similarity: 0.45

# --- Candidate reranking (optional, independently gated) ---
# Uses only a bounded fused-candidate shortlist and falls back to the baseline
# order on input/dependency failure. Elapsed model time is diagnostic only.
# Disable this independently to roll back.
reranker:
  enabled: false
  implementation: transparent_logistic
  shortlist_size: 8
  max_input_bytes: 65536
  max_model_time_ms: 25

# --- Namespace rollout ---
# The default preserves normal regulated answers. Exact namespace overrides may
# use: disabled, shadow, evidence_only, regulated_direct_answer, or rollback.
rollout:
  default_mode: regulated_direct_answer
  namespaces: {}

# --- Deterministic utility resolver (optional, local) ---
# Only these compiled-in plugins can run. Requests must use the documented
# command grammars; Python expressions, imports, and third-party plugins are
# never accepted. Plugins can be promoted or rolled back independently.
utility:
  enabled: false
  plugins:
    - arithmetic
    - boolean
    - set
    - date_time
    - unit_conversion
    - version
    - identifier

# --- Output processing ---
polish_responses: true # Repair casing in pattern-path responses

# --- Fallback ---
fallback_response: "" # Response when nothing matches ("" = no fallback)

# --- Conversation ---
# Seed files load once at startup, in the order listed. Paths are relative to
# this file. Leave the list empty for a silent process. To run as a social
# bot, list the corpus files here. Keep the catch-all pattern in one file.
# engram/data/seed.json holds the catch-all "*" pattern, so every input gets a
# pattern reply and the keyword retrieval and LLM fallbacks never run. An enabled
# graph still answers questions and commands before the pattern reply.
# duplicate_policy defaults to error, which rejects a repeated pattern.
# Set it to last when a later file should replace that same pattern, or
# first to keep the earlier pair. Different patterns are kept either way.
conversation:
  bot_name: ENGRAM
  # duplicate_policy: last   # error (default), last, or first
  seed_files: []
  # To run as a social bot, replace the line above with a list:
  # seed_files:
  #   - engram/data/seed.json
  #   - engram/data/software_development.json
  # AIML tables load before the categories. Leave them unset until a file exists.
  # set_files: []            # JSON object: set name -> list of words
  # map_files: []            # JSON object: map name -> object of strings
  # properties_file: ""      # flat bot properties; bot_name still wins
  # predicate_file: ""       # defaults copied into each new session
  # substitution_file: ""    # optional contractions, person, person2, gender, custom

# --- Knowledge graph (optional) ---
# Graph database connection over Bolt with Cypher queries (for example Memgraph
# or Neo4j). The graph's schema must include every definition in engram/schema.cypher;
# it may have more. The graph's owner creates them; Engram only reads the graph.
# Check a graph with `PYTHONPATH=. python3 scripts/verify_schema.py`. The password is never saved with cache state;
# supply it through this external runtime configuration.
# The graph database is optional and off by default, so Engram runs without one.
# To run with a graph database, set enabled: true and set host, port, username
# and password for it; set vector_enabled: true and vector_model_path as well to
# add vector recall over its Proposition index. When enabled, the graph must be
# reachable and have a compatible schema at startup, or startup fails. A graph
# read that fails later returns no rows and is logged, while Engram's local
# retrieval and conversation paths continue.
graph:
  host: localhost
  port: 7687
  username: ""
  password: ""
  enabled: false # true runs with the graph database above
  vector_enabled: false
  vector_index_name: proposition_embeddings
  vector_model: all-MiniLM-L6-v2
  vector_model_path: ""
  vector_dimension: 384
  vector_limit: 250
  vector_support_scan_limit: 100000 # Bound matched Proposition-support fan-out
  vector_min_similarity: 0.45
  vector_weight: 0.75

# --- Health page ---
# Serves the Engram health page and API at http://127.0.0.1:8101/ (/api/health,
# /health/live, /health/ready). Loopback by default; a private LAN unicast
# address is allowed. The listener binds exactly this port; a port in use is
# reported on the health snapshot while Engram keeps serving.
http:
  enabled: true
  host: 127.0.0.1
  port: 8101
  refresh_seconds: 5.0
