[project]
name = "engram"
dynamic = ["version"]
description = "In-process conversational retrieval and regulated response resolution"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Thought Pattern AI"}
]
keywords = ["nlp", "retrieval", "cache", "conversational", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are hard requirements (no lazy/optional degradation):
# every module imports its dependencies at the top. Keep in step with
# requirements.txt, which carries the pinned versions.
dependencies = [
    "PyYAML>=6.0.3",
    "nltk>=3.10.3",
    "spacy>=3.8.16",
    "sentence-transformers>=6.0.1",
    "pymgclient>=1.6.0",
    "mcp>=2.1.1,<3",
    "grpcio>=1.83.1,<1.84",
    "grpcio-health-checking>=1.83.1,<1.84",
    "protobuf>=7.36.0,<8",
    "tzdata==2026.3",
]

[project.scripts]
engram-mcp = "engram.mcp_server:main"
engram-grpc = "engram.grpc_server:console_main"

[project.optional-dependencies]
dev = [
    "bandit",
    "black",
    "isort",
    "pip-audit>=2.10.1",
    "psutil",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
    "grpcio-tools==1.83.1",
    "vulture",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["engram*"]

[tool.setuptools.package-data]
engram = ["*.proto", "*.pyi", "data/*.json"]

[tool.setuptools.dynamic]
version = {attr = "engram.constants.VERSION"}

[tool.ruff]
line-length = 132
target-version = "py312"
extend-exclude = ["engram/engram_pb2*.py", "engram/engram_pb2*.pyi"]

[tool.pyright]
include = ["engram", "scripts", "eval", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID251"]
ignore = ["E501", "UP038"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing".msg = "Use native Python types and runtime validation; do not import typing."
"typing_extensions".msg = "Use native Python types and runtime validation; do not import typing_extensions."

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Runnable entrypoints put the repo root on sys.path before importing the
# package, so their package imports are intentionally not at the top of file.
"scripts/*" = ["E402"]
"eval/*" = ["E402"]
# Generated gRPC method names follow the protobuf service contract.
"engram/grpc_server.py" = ["N802"]
# These files are compiler output and are checked for reproducibility in tests.
"engram/engram_pb2*" = ["ALL"]

# Black is the formatter of record: `black -l 132 -t py311`. The runtime targets
# 3.12+ (see requires-python and ruff target-version), but the py311 formatting
# style is intentionally retained instead of py312's.
[tool.black]
line-length = 132
target-version = ["py311"]
extend-exclude = "engram/engram_pb2.*"

# isort uses the black profile + matching line length so it never disagrees with
# black (or ruff's own `I` import-order rule) on how to wrap parenthesized imports.
[tool.isort]
profile = "black"
line_length = 132
known_first_party = ["engram"]
combine_as_imports = true
skip_glob = ["engram/engram_pb2*"]

[tool.vulture]
paths = ["engram", "scripts", "eval"]
exclude = ["engram/engram_pb2*.py"]
min_confidence = 65
ignore_names = ["exc_type", "exc_value", "traceback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
