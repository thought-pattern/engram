[project]
name = "engram"
dynamic = ["version"]
description = "Keyword-indexed statement store with hit-rate tracking for conversational systems"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Thought Pattern AI"}
]
keywords = ["nlp", "retrieval", "cache", "conversational", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

# The CLI lives at scripts/cli.py (run: `python scripts/cli.py`). It is not a
# packaged console entry point; scripts/ is intentionally outside the engram
# package.

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["engram*"]

[tool.setuptools.dynamic]
version = {attr = "engram.constants.VERSION"}

[tool.ruff]
line-length = 132
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Runnable entrypoints put the repo root on sys.path before importing the
# package, so their package imports are intentionally not at the top of file.
"scripts/*" = ["E402"]
"eval/*" = ["E402"]

# Black is the formatter of record: `black -l 132 -t py311`. The code targets
# 3.12+ (see requires-python and ruff target-version), but the py311 formatting
# style is preferred over py312's.
[tool.black]
line-length = 132
target-version = ["py311"]

# isort uses the black profile + matching line length so it never disagrees with
# black (or ruff's own `I` import-order rule) on how to wrap parenthesized imports.
[tool.isort]
profile = "black"
line_length = 132
known_first_party = ["engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
