[project]
name = "engram"
dynamic = ["version"]
description = "Keyword-indexed statement store with hit-rate tracking for conversational systems"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
authors = [
    {name = "Thought Pattern AI"}
]
keywords = ["nlp", "retrieval", "cache", "conversational", "chatbot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are hard requirements (no lazy/optional degradation):
# every module imports its dependencies at the top. Keep in step with
# requirements.txt, which carries the pinned versions.
dependencies = [
    "PyYAML>=6.0",
    "nltk>=3.9",
    "spacy>=3.8",
    "pymgclient>=1.5",
    "mcp>=1.27,<2",
    "grpcio>=1.83,<1.84",
    "grpcio-health-checking>=1.83,<1.84",
    "protobuf>=7.35.1,<8",
]

# The CLI lives at scripts/cli.py (run: `python scripts/cli.py`). It is not a
# packaged console entry point; scripts/ is intentionally outside the engram
# package.

[project.scripts]
engram-mcp = "engram.mcp_server:main"
engram-grpc = "engram.grpc_server:main"

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "grpcio-tools==1.83.0",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["engram*"]

[tool.setuptools.package-data]
engram = ["v1/*.proto", "v1/*.pyi"]

[tool.setuptools.dynamic]
version = {attr = "engram.constants.VERSION"}

[tool.ruff]
line-length = 132
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# Runnable entrypoints put the repo root on sys.path before importing the
# package, so their package imports are intentionally not at the top of file.
"scripts/*" = ["E402"]
"eval/*" = ["E402"]
# Generated gRPC method names follow the protobuf service contract.
"engram/grpc_server.py" = ["N802"]
# These files are compiler output and are checked for reproducibility in tests.
"engram/v1/engram_pb2*" = ["ALL"]

# Black is the formatter of record: `black -l 132 -t py311`. The code targets
# 3.12+ (see requires-python and ruff target-version), but the py311 formatting
# style is preferred over py312's.
[tool.black]
line-length = 132
target-version = ["py311"]
extend-exclude = "engram/v1/engram_pb2.*"

# isort uses the black profile + matching line length so it never disagrees with
# black (or ruff's own `I` import-order rule) on how to wrap parenthesized imports.
[tool.isort]
profile = "black"
line_length = 132
known_first_party = ["engram"]
combine_as_imports = true
skip_glob = ["engram/v1/engram_pb2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
